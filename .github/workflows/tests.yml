name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Create an isolated test runtime
        # Hosted toolcache paths are shared-writable; mirror the user's private venv.
        run: |
          python -m venv --copies .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Check release tag matches runtime version
        if: github.ref_type == 'tag'
        run: |
          python -I -B - <<'PY'
          import os
          import runpy
          version = runpy.run_path('src/hermes_gateway_herdr/__init__.py')['__version__']
          if os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit('Release tag does not match the runtime version')
          PY
      - name: Run isolated tests with fake Gateways and real PTYs
        run: .venv/bin/python -I -B tests/run.py
