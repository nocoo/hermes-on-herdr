# Runtime manifest. Validation scope and installation: docs/15-发布与安装.md.
id = "nocoo.hermes-gateway"
name = "hermes on herdr"
version = "0.1.4"
min_herdr_version = "0.9.0"
platforms = ["macos", "linux"]
description = "Keep a Hermes dashboard and managed Gateway in Herdr"

[[startup]]
command = ["./bin/hermes-on-herdr", "ensure", "--source", "startup"]

[[events]]
on = "workspace.focused"
command = ["./bin/hermes-on-herdr", "ensure", "--source", "event"]

[[events]]
on = "pane.exited"
command = ["./bin/hermes-on-herdr", "ensure", "--source", "event"]

[[events]]
on = "pane.closed"
command = ["./bin/hermes-on-herdr", "ensure", "--source", "event"]

[[panes]]
id = "gateway"
title = "Dashboard 未就绪？运行 hermes-on-herdr 查看原因并恢复。"
placement = "tab"
command = ["./bin/hermes-on-herdr", "supervise"]

[[panes]]
id = "recovery"
title = "hermes on herdr · 恢复中心"
placement = "popup"
width = "90%"
height = "90%"
command = ["./bin/hermes-on-herdr", "recover"]

[[actions]]
id = "recover"
title = "hermes on herdr: Recovery & Repair"
command = ["./bin/hermes-on-herdr", "recover", "--open"]

[[actions]]
id = "monitor"
title = "hermes on herdr: Open Dashboard"
command = ["./bin/hermes-on-herdr", "monitor"]

[[actions]]
id = "start"
title = "hermes on herdr: Start"
command = ["./bin/hermes-on-herdr", "start"]

[[actions]]
id = "resume"
title = "hermes on herdr: Resume"
command = ["./bin/hermes-on-herdr", "resume"]

[[actions]]
id = "pause"
title = "hermes on herdr: Pause"
command = ["./bin/hermes-on-herdr", "pause"]

[[actions]]
id = "stop"
title = "hermes on herdr: Stop"
command = ["./bin/hermes-on-herdr", "stop"]

[[actions]]
id = "restart"
title = "hermes on herdr: Restart"
command = ["./bin/hermes-on-herdr", "restart"]

[[actions]]
id = "status"
title = "hermes on herdr: Status"
command = ["./bin/hermes-on-herdr", "status", "--json"]

[[actions]]
id = "doctor"
title = "hermes on herdr: Doctor"
command = ["./bin/hermes-on-herdr", "doctor", "--json"]

[[actions]]
id = "logs"
title = "hermes on herdr: Lifecycle Logs"
command = ["./bin/hermes-on-herdr", "logs", "--json"]
