# Development manifest. Full lifecycle and message validation remain pending.
id = "nocoo.hermes-gateway"
name = "hermes on herdr"
version = "0.1.0-alpha.0"
min_herdr_version = "0.9.0"
platforms = ["macos", "linux"]
description = "Run Hermes in Herdr with optional monitoring"

[[startup]]
command = ["./bin/hermes-on-herdr", "ensure", "--source", "startup"]

[[events]]
on = "workspace.focused"
command = ["./bin/hermes-on-herdr", "ensure", "--source", "event"]

[[events]]
on = "pane.exited"
command = ["./bin/hermes-on-herdr", "ensure", "--source", "event"]

[[events]]
on = "pane.closed"
command = ["./bin/hermes-on-herdr", "ensure", "--source", "event"]

[[panes]]
id = "gateway"
title = "hermes on herdr"
placement = "tab"
command = ["./bin/hermes-on-herdr", "supervise"]

[[actions]]
id = "start"
title = "hermes on herdr: Start"
command = ["./bin/hermes-on-herdr", "start"]

[[actions]]
id = "resume"
title = "hermes on herdr: Resume"
command = ["./bin/hermes-on-herdr", "resume"]

[[actions]]
id = "pause"
title = "hermes on herdr: Pause"
command = ["./bin/hermes-on-herdr", "pause"]

[[actions]]
id = "stop"
title = "hermes on herdr: Stop"
command = ["./bin/hermes-on-herdr", "stop"]

[[actions]]
id = "restart"
title = "hermes on herdr: Restart"
command = ["./bin/hermes-on-herdr", "restart"]

[[actions]]
id = "status"
title = "hermes on herdr: Status"
command = ["./bin/hermes-on-herdr", "status", "--json"]

[[actions]]
id = "doctor"
title = "hermes on herdr: Doctor"
command = ["./bin/hermes-on-herdr", "doctor", "--json"]

[[actions]]
id = "logs"
title = "hermes on herdr: Lifecycle Logs"
command = ["./bin/hermes-on-herdr", "logs", "--json"]
