# Development manifest. Installation and real-host validation have not been run.
id = "nocoo.hermes-gateway"
name = "Hermes Gateway"
version = "0.1.0-alpha.0"
min_herdr_version = "0.9.0"
platforms = ["macos", "linux"]
description = "A dedicated Gateway supervised inside its owning Herdr pane."

[[startup]]
command = ["./bin/hermes-gateway-herdr", "ensure", "--source", "startup"]

[[events]]
on = "workspace.focused"
command = ["./bin/hermes-gateway-herdr", "ensure", "--source", "event"]

[[events]]
on = "pane.exited"
command = ["./bin/hermes-gateway-herdr", "ensure", "--source", "event"]

[[events]]
on = "pane.closed"
command = ["./bin/hermes-gateway-herdr", "ensure", "--source", "event"]

[[panes]]
id = "gateway"
title = "Hermes Gateway"
placement = "tab"
command = ["./bin/hermes-gateway-herdr", "supervise"]

[[actions]]
id = "start"
title = "Hermes Gateway: Start"
command = ["./bin/hermes-gateway-herdr", "start"]

[[actions]]
id = "resume"
title = "Hermes Gateway: Resume"
command = ["./bin/hermes-gateway-herdr", "resume"]

[[actions]]
id = "pause"
title = "Hermes Gateway: Pause"
command = ["./bin/hermes-gateway-herdr", "pause"]

[[actions]]
id = "stop"
title = "Hermes Gateway: Stop"
command = ["./bin/hermes-gateway-herdr", "stop"]

[[actions]]
id = "restart"
title = "Hermes Gateway: Restart"
command = ["./bin/hermes-gateway-herdr", "restart"]

[[actions]]
id = "status"
title = "Hermes Gateway: Status"
command = ["./bin/hermes-gateway-herdr", "status", "--json"]

[[actions]]
id = "doctor"
title = "Hermes Gateway: Doctor"
command = ["./bin/hermes-gateway-herdr", "doctor", "--json"]

[[actions]]
id = "logs"
title = "Hermes Gateway: Lifecycle Logs"
command = ["./bin/hermes-gateway-herdr", "logs", "--json"]
